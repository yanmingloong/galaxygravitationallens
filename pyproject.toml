[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxylens"
version = "0.1.0"
description = "Strong gravitational lens modeling for disk and elliptical galaxies: observational data pipeline, mock pipeline, and lens fitting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yanming Long" }]
keywords = ["gravitational lensing", "galaxies", "dark matter", "astronomy", "strong lensing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://gitee.com/longym8/galaxygravitationallens"
Repository = "https://github.com/yanmingloong/galaxygravitationallens"
"Bug Tracker" = "https://gitee.com/longym8/galaxygravitationallens/issues"

# Core dependencies (kept minimal; heavy scientific deps are optional)
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "pyyaml",
    "pandas",
]

[project.optional-dependencies]
data = ["photutils", "regions"]
lens = ["autolens", "autofit", "nautilus-sampler"]
dynamics = ["agama", "mgefit", "jampy"]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
galaxylens = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
